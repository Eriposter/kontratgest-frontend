server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ======================================================
    # ROTAS ANGULAR (SPA)
    # ======================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ======================================================
    # CACHE DE ASSETS (CSS/JS/IMAGENS) — MELHOR PERFORMANCE
    # ======================================================
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ======================================================
    # GZIP — REDUZ TAMANHO DOS ARQUIVOS
    # ======================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 10240;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
}
