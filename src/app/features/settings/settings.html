<div class="settings-page animate-fade-in">
  
  <!-- Cabeçalho -->
  <div class="settings-header">
    <div>
      <h1 class="settings-title">Definições</h1>
      <p class="settings-subtitle">Configure o sistema de acordo com as necessidades da sua organização</p>
    </div>
  </div>

  <!-- Layout com Sidebar -->
  <div class="settings-layout">
    
    <!-- Sidebar de Navegação -->
    <aside class="settings-sidebar">
      <nav class="settings-nav">
        <button 
          *ngFor="let section of sections"
          (click)="setActiveSection(section.id)"
          [class.active]="activeSection === section.id"
          class="settings-nav-item"
        >
          <svg class="settings-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath(section.icon)"/>
          </svg>
          <div class="settings-nav-content">
            <span class="settings-nav-label">{{ section.label }}</span>
            <span class="settings-nav-desc">{{ section.description }}</span>
          </div>
        </button>
      </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="settings-content">
      
      <!-- Perfil da Empresa -->
      <app-company-profile *ngIf="activeSection === 'company'"></app-company-profile>

      <!-- Funcionalidades -->
      <app-features-settings *ngIf="activeSection === 'features'"></app-features-settings>

      <!-- Configurações Fiscais -->
      <app-fiscal-settings *ngIf="activeSection === 'fiscal'"></app-fiscal-settings>

      <!-- Utilizadores -->
      <app-users-settings *ngIf="activeSection === 'users'"></app-users-settings>

      <!-- Roles e Permissões -->
      <app-roles-settings *ngIf="activeSection === 'roles'"></app-roles-settings>

    </main>
  </div>
</div>
