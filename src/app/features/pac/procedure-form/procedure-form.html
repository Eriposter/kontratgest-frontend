<div class="procedure-form">
  <div class="form-header">
    <div>
      <h2>{{ isEdit ? 'Editar Procedimento' : 'Novo Procedimento de Contratação' }}</h2>
      <p *ngIf="need">Necessidade: {{ need.title }}</p>
    </div>
    <button class="close-btn" (click)="close.emit()">×</button>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {{ errorMessage }}
  </div>

  <div class="form-scroll-container">
    <form (ngSubmit)="onSubmit()" class="form-content">
      <!-- Secção 1: Datas do Procedimento -->
      <div class="form-section">
        <h3 class="section-title">Datas do Procedimento</h3>
        <div class="form-row two-cols">
          <div class="form-group">
            <label>Data de Início do Procedimento *</label>
            <input type="date" [(ngModel)]="formData.procedure_start_date" name="procedure_start_date" required class="form-input">
          </div>
          <div class="form-group">
            <label>Data de Fim do Procedimento *</label>
            <input type="date" [(ngModel)]="formData.procedure_end_date" name="procedure_end_date" required class="form-input">
          </div>
        </div>

        <div class="form-row two-cols">
          <div class="form-group">
            <label>Data Confirmada de Início (após adjudicação)</label>
            <input type="date" [(ngModel)]="formData.confirmed_start_date" name="confirmed_start_date" class="form-input">
          </div>
          <div class="form-group">
            <label>Data Confirmada de Fim</label>
            <input type="date" [(ngModel)]="formData.confirmed_end_date" name="confirmed_end_date" class="form-input">
          </div>
        </div>
      </div>

      <!-- Secção 2: Entidade Vencedora (apenas na adjudicação) -->
      <div class="form-section" *ngIf="isEdit && procedure?.status === 'evaluation'">
        <h3 class="section-title">Adjudicação</h3>
        <div class="form-row">
          <div class="form-group form-group--full">
            <label>Entidade Vencedora *</label>
            <select [(ngModel)]="formData.winning_entity_id" name="winning_entity_id" class="form-select" [disabled]="loadingEntities">
              <option value="">Selecionar entidade...</option>
              <option *ngFor="let entity of entities" [value]="entity.id">
                {{ entity.identification.name }} (NIF: {{ entity.identification.nif }})
              </option>
            </select>
            <p class="form-hint" *ngIf="loadingEntities">A carregar entidades...</p>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group form-group--full">
            <label>Notas de Adjudicação</label>
            <textarea [(ngModel)]="formData.adjudication_notes" name="adjudication_notes" class="form-textarea" rows="3" placeholder="Motivos da adjudicação, valores propostos, etc."></textarea>
          </div>
        </div>
      </div>

      <!-- Secção 3: Notas -->
      <div class="form-section">
        <h3 class="section-title">Observações</h3>
        <div class="form-row">
          <div class="form-group form-group--full">
            <textarea [(ngModel)]="formData.notes" name="notes" class="form-textarea" rows="3" placeholder="Observações sobre o procedimento..."></textarea>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="form-footer">
    <button type="button" (click)="close.emit()" class="btn-secondary">Cancelar</button>
    <button type="submit" (click)="onSubmit()" [disabled]="isSaving" class="btn-primary">
      <span *ngIf="!isSaving">{{ isEdit ? 'Atualizar' : 'Criar' }} Procedimento</span>
      <span *ngIf="isSaving">A guardar...</span>
    </button>
  </div>
</div>
