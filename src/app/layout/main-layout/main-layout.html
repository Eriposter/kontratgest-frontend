                d="M203.9,283.38c5.66-5.65,11.2-11.44,17.05-16.9,5.81,4.4,10.52,9.99,15.69,15.09,6.25,6.28,12.76,12.31,18.66,18.94-4.82,5.59-10.39,10.46-15.4,15.87-4.41,4.74-10.38,8.37-17.01,8.47-7.85.24-16.81-2.26-21.22-9.27-3.73-5.86-6.32-13.06-4.58-20.04.88-4.67,3.45-8.84,6.81-12.16ZM217.29,292.65c-2.89,1.82-4.87,5.21-4.86,8.64.45,3,2.38,5.86,5.09,7.27,2.48.82,5.27.79,7.77.03,3.8-1.97,6.33-6.97,4.34-11.04-1.82-4.67-7.83-7.2-12.34-4.9Z" />
            </g>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-surface-900 tracking-tight">SONA</h1>
          <p class="text-xs text-surface-500">Gestão de Contratos</p>
        </div>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="px-4 pt-6 pb-2">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-surface-400" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" placeholder="Pesquisar..."
          class="w-full pl-10 pr-4 py-2.5 bg-surface-50 border border-surface-200 rounded-lg text-sm placeholder-surface-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
        <kbd
          class="absolute right-3 top-1/2 -translate-y-1/2 px-1.5 py-0.5 text-xs text-surface-400 bg-white border border-surface-200 rounded">⌘K</kbd>
      </div>
    </div>

    <!-- Menu de Navegação -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <p class="px-3 pt-2 pb-1 text-xs font-semibold text-surface-400 uppercase tracking-wider">Menu Principal</p>

      <a *ngFor="let item of menuItems" [routerLink]="item.route"
        routerLinkActive="bg-primary-50 text-primary-700 border-primary-200"
        class="group flex items-center justify-between px-3 py-2.5 text-surface-600 rounded-lg hover:bg-surface-50 hover:text-surface-900 border border-transparent transition-all duration-200">

        <div class="flex items-center gap-3">
          <!-- Ícones SVG -->
          <ng-container [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'home'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <svg *ngSwitchCase="'calendar'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <svg *ngSwitchCase="'building'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            <svg *ngSwitchCase="'document'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <svg *ngSwitchCase="'measurement'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            <svg *ngSwitchCase="'shield'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <svg *ngSwitchCase="'money'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <svg *ngSwitchCase="'chart'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
          </ng-container>
          <span class="text-sm font-medium">{{ item.label }}</span>
        </div>

        <!-- Badge -->
        <!-- <span *ngIf="item.badge" class="px-2 py-0.5 text-xs font-semibold bg-primary-100 text-primary-700 rounded-full">
          {{ item.badge }}
        </span> -->
      </a>

      <!-- Separador -->
      <div class="pt-6 pb-2">
        <p class="px-3 pb-1 text-xs font-semibold text-surface-400 uppercase tracking-wider">Sistema</p>
      </div>

      <a routerLink="/settings" routerLinkActive="bg-primary-50 text-primary-700 border-primary-200"
        class="flex items-center gap-3 px-3 py-2.5 text-surface-600 rounded-lg hover:bg-surface-50 hover:text-surface-900 border border-transparent transition-all duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="text-sm font-medium">Definições</span>
      </a>
    </nav>

    <!-- Perfil do Utilizador -->
    <div class="p-4 border-t border-surface-100">
      <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-surface-50 transition-colors cursor-pointer group">
        <!-- Avatar com Gradiente -->
        <div [ngClass]="'bg-gradient-to-br ' + gradientClass"
          class="w-10 h-10 rounded-full flex items-center justify-center text-white font-semibold text-sm shadow-md ring-2 ring-white">
          {{ userInitials }}
        </div>

        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-surface-900 truncate">{{ currentUser?.name }}</p>
          <p class="text-xs text-surface-500 truncate">{{ currentUser?.professional?.department }}</p>
        </div>

        <!-- Botão de Logout -->
        <button (click)="logout()"
          class="opacity-0 group-hover:opacity-100 p-1.5 text-surface-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-all"
          title="Terminar sessão">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Topbar Moderna -->
    <header class="h-20 bg-white border-b border-surface-200/80 flex items-center justify-between px-8 shadow-sm">
      <!-- Breadcrumbs / Título da Página -->
      <div>
        <!-- <div class="flex items-center gap-2 text-sm text-surface-500">
          <a routerLink="/dashboard" class="hover:text-primary-600 transition-colors">Início</a>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
          <span class="text-surface-900 font-medium">Dashboard</span>
        </div> -->
        <!-- <h2 class="text-xl font-bold text-surface-900 mt-1">Visão Geral do Sistema</h2> -->
      </div>

      <!-- Ações do Topbar -->
      <div class="flex items-center gap-3">
        <!-- Data/Hora atual -->
        <div class="hidden md:flex items-center gap-2 px-4 py-2 bg-surface-50 rounded-lg border border-surface-200">
          <svg class="w-4 h-4 text-surface-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="text-sm font-medium text-surface-700">{{ currentDate }}</span>
        </div>

        <!-- Botão de Notificações -->
        <button
          class="relative p-2.5 text-surface-500 hover:text-surface-900 hover:bg-surface-50 rounded-lg transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
        </button>

        <!-- Botão de Ajuda -->
        <button class="p-2.5 text-surface-500 hover:text-surface-900 hover:bg-surface-50 rounded-lg transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>

        <!-- Botão de Ação Principal -->
        <!-- <button class="btn-primary flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>Novo Contrato</span>
        </button> -->
      </div>
    </header>

    <!-- Área de Conteúdo -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-surface-50 p-8 animate-fade-in">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
